name: CodeQL

# Static security analysis of the library and its scripts (OpenSSF Scorecard: SAST).

on:
  # On develop only, as CI: every push to it and every pull request into it, so main isn't analysed again after a
  # merge. The weekly run analyses main, which keeps the Security tab's alerts for it current.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "0 22 * * 1" # Tuesdays 03:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
