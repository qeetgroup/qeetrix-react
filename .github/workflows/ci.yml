name: CI

# Every gate, on develop only: every push to it and every pull request into it (decisions D-07, D-10, D-14). A
# develop → main pull request is checked by develop's run on the same commit, and main isn't checked again after
# the merge: main requires Verify on an up-to-date branch, so what's merged is exactly what passed here.
# Once Argos is connected, its baselines come from builds of main: add a push to main for it then.
# The nightly run, on develop, adds Firefox and WebKit to the browser tests.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }} # the nightly run checks develop too
          fetch-depth: 0 # the API version check compares with main or the pull request's base
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: no build or test output is committed
        run: |
          if tracked=$(git ls-files | grep -E '(^|/)(dist|coverage|snapshots|\.vitest|node_modules)/'); then
            echo "::error::Generated files are committed — remove them and fix .gitignore:"
            echo "$tracked"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - name: install the compiler-lint tool (TypeScript 6, isolated)
        run: bun install --frozen-lockfile --cwd tools/eslint
      - name: install browsers
        env:
          BROWSERS: ${{ github.event_name == 'schedule' && 'chromium firefox webkit' || 'chromium' }}
        run: bun x playwright install --with-deps $BROWSERS

      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:compiler
      - name: source, built output, API report and package checks
        run: bun run check
      - name: a removed or changed API needs a raised version
        if: github.event_name != 'schedule'
        env:
          # A pull request into develop compares with develop; develop itself with main, what's released.
          BASE: ${{ github.base_ref || 'main' }}
        run: node scripts/check-api-version.mjs "origin/$BASE"

      # V8 coverage reads Chromium's engine only, so the nightly Firefox and WebKit run tests
      # without it; every pull request still measures coverage in Chromium.
      - name: tests (real browser and server), coverage and screenshots
        run: bun run ${{ github.event_name == 'schedule' && 'test' || 'test:coverage' }}
        env:
          QX_BROWSERS: ${{ github.event_name == 'schedule' && 'chromium,firefox,webkit' || 'chromium' }}
          # Screenshots upload to Argos once the repository is connected (repo variable
          # QEETRIX_ARGOS_ENABLED=true); until then they are captured but not compared.
          ARGOS_UPLOAD: ${{ vars.QEETRIX_ARGOS_ENABLED == 'true' && github.event_name != 'schedule' }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
