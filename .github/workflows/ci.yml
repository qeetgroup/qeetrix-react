name: CI

# Verify, once per change: on every pull request into develop (Dependabot's, a contributor's) and on the
# develop → main pull request, which is what main takes. Pushes run nothing, so no commit is checked twice.
#
# Verify is the quick gate: install, types, format and lint, the React Compiler's rules and a dependency audit.
# The build, the package checks and the browser tests run locally before pushing (AGENTS.md, "Before you push");
# the release builds and checks the package again before it publishes.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: no build or test output is committed
        run: |
          if tracked=$(git ls-files | grep -E '(^|/)(dist|coverage|snapshots|\.vitest|node_modules)/'); then
            echo "::error::Generated files are committed — remove them and fix .gitignore:"
            echo "$tracked"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - name: install the compiler-lint tool (TypeScript 6, isolated)
        run: bun install --frozen-lockfile --cwd tools/eslint

      - run: bun run typecheck
      - name: format and lint (Biome)
        run: bun run lint
      - name: React Compiler rules
        run: bun run lint:compiler
      - name: dependency audit
        run: bun audit
