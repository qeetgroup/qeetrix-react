name: CI

# Every gate, on every pull request and every push to develop and main (decisions D-07, D-10, D-14).
# The nightly run adds Firefox and WebKit to the browser tests.

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the API version check compares with the base branch
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - name: install the compiler-lint tool (TypeScript 6, isolated)
        run: bun install --frozen-lockfile --cwd tools/eslint
      - name: install browsers
        env:
          BROWSERS: ${{ github.event_name == 'schedule' && 'chromium firefox webkit' || 'chromium' }}
        run: bun x playwright install --with-deps $BROWSERS

      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:compiler
      - name: source, built output, API report and package checks
        run: bun run check
      - name: a removed or changed API needs a raised version
        if: github.event_name == 'pull_request'
        run: node scripts/check-api-version.mjs "origin/${{ github.base_ref }}"

      - name: tests (real browser and server), coverage and screenshots
        run: bun run test:coverage
        env:
          QX_BROWSERS: ${{ github.event_name == 'schedule' && 'chromium,firefox,webkit' || 'chromium' }}
          # Screenshots upload to Argos once the repository is connected (repo variable
          # QEETRIX_ARGOS_ENABLED=true); until then they are captured but not compared.
          ARGOS_UPLOAD: ${{ vars.QEETRIX_ARGOS_ENABLED == 'true' && github.event_name != 'schedule' }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
