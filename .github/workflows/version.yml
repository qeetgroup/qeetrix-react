name: Version

# Bumps the patch version of @qeetrix/react on the PR branch, so the version you are releasing is
# visible in the PR diff and reviewable like any other change.
#
# Want a minor or major bump instead? Edit `version` in packages/react/package.json yourself. This
# workflow only acts when the PR's version still equals the base branch's, so a manual bump is left
# alone. (The CI API check requires a minor when the public API loses or changes anything.)
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # A fork PR gets a read-only token and cannot be pushed to, and a bot's own commit must not
    # trigger another bump.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      actions: write # start CI on the bumped commit (see the last step)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: bump the patch version unless it is already raised
        id: bump
        env:
          BASE: ${{ github.base_ref }}
          NPM_REGISTRY: ${{ vars.QEETRIX_NPM_REGISTRY }}
          PKG: packages/react/package.json
        run: |
          set -euo pipefail

          # A PR can be merged before this job runs; its head is then already in the base branch.
          if git merge-base --is-ancestor HEAD "origin/$BASE"; then
            echo "This PR's head is already in $BASE (merged or empty). Nothing to bump."
            exit 0
          fi

          current=$(node -p "require('./$PKG').version")

          # The first PR into a base with no package yet: the version in the PR is the one to ship.
          if ! base_package=$(git show "origin/$BASE:$PKG" 2>/dev/null); then
            echo "$BASE has no $PKG yet — first release of $current. Leaving it alone."
            exit 0
          fi
          base=$(printf '%s' "$base_package" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")

          echo "PR version: $current"
          echo "$BASE version: $base"

          if [ "$current" != "$base" ]; then
            echo "Version already raised in this PR. Leaving it alone."
            exit 0
          fi

          # The next patch npm has never accepted: a version that was published and later
          # unpublished can never be published again, so it is skipped.
          next=$(node scripts/npm-versions.mjs next "$base")
          echo "Bumping $current -> $next"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('$PKG', 'utf8'));
            pkg.version = '$next';
            fs.writeFileSync('$PKG', JSON.stringify(pkg, null, 2) + '\n');
          "

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PKG"
          git commit -m "chore: bump version to $next"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # GitHub holds pull_request runs on a commit pushed by this workflow ("action required"), and
      # main requires CI on the PR's latest commit. A run started explicitly is not held, so start
      # CI on the bumped commit: its "Verify" result is what branch protection checks.
      - name: run CI on the bumped commit
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.head_ref }}" --repo "${{ github.repository }}"
