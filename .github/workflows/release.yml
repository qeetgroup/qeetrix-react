name: Release

# Publishes @qeetrix/react to npm on merge to main, then tags the commit (decision D-07).
#
#   1. Open a PR. version.yml bumps the patch on your branch; raise minor or major by hand.
#   2. Merge to main. The gate job runs every check again.
#   3. The publish job waits for an approver in the `npm-publish` environment. Once approved it
#      publishes through npm trusted publishing (OIDC, no long-lived token) with provenance,
#      pushes the vX.Y.Z tag and opens a GitHub Release.
#   4. Bad release? Run rollback.yml: it moves `latest` back. npm never republishes a version.
#
# Re-running is safe: if the version is already on the registry, nothing is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  PKG_DIR: packages/react

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags must be visible
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: version
        name: is there anything to release?
        env:
          NPM_REGISTRY: ${{ vars.QEETRIX_NPM_REGISTRY }}
        run: |
          set -uo pipefail
          version=$(node -p "require('./$PKG_DIR/package.json').version")
          name=$(node -p "require('./$PKG_DIR/package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name"       >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version exists but $name@$version is not published. Resolve by hand."
            exit 1
          elif ! node scripts/npm-versions.mjs check "$version"; then
            # npm view reports an unpublished version as missing, but npm publish refuses it.
            echo "::error::$name@$version was published before and later unpublished; npm never accepts it again. Raise the version."
            exit 1
          else
            echo "$name@$version is new — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # The same gate as CI. Nothing below runs when the version is unchanged.
      - if: steps.version.outputs.release == 'true'
        run: bun install --frozen-lockfile && bun install --frozen-lockfile --cwd tools/eslint
      - if: steps.version.outputs.release == 'true'
        run: bun x playwright install --with-deps chromium
      - if: steps.version.outputs.release == 'true'
        run: bun run build && bun run typecheck && bun run lint && bun run lint:compiler
      - if: steps.version.outputs.release == 'true'
        run: bun run check
      - if: steps.version.outputs.release == 'true'
        run: bun run test:coverage

      - if: steps.version.outputs.release == 'false'
        name: report that the version is unchanged
        run: |
          {
            echo "## Nothing to release"
            echo
            echo "\`${{ steps.version.outputs.version }}\` is already on the registry."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewer: nothing reaches npm until an approver approves this job.
    environment: npm-publish
    permissions:
      contents: write # push the version tag and create the release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11, required for trusted publishing
          registry-url: ${{ vars.QEETRIX_NPM_REGISTRY || 'https://registry.npmjs.org' }}
          scope: "@qeetrix"

      - run: bun install --frozen-lockfile && bun run build

      # Trusted publishing: npm exchanges this job's OIDC identity for a short-lived publish token.
      # `npm publish`, not `bun publish`: bun supports neither OIDC nor provenance.
      #
      # FIRST PUBLISH ONLY: npm configures a trusted publisher in the package's settings, so the
      # package must exist first. 0.0.1 therefore publishes with the organisation's NPM_TOKEN.
      # Once the trusted publisher is configured on npmjs.com (repository qeetgroup/qeetrix-react,
      # workflow release.yml, environment npm-publish), npm prefers the OIDC identity, and this
      # repository's access to NPM_TOKEN is removed.
      - name: publish to npm
        working-directory: ${{ env.PKG_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # Tag AFTER a successful publish, so every tag is a version that shipped.
      - name: tag the release and open a GitHub Release
        env:
          TAG: v${{ needs.gate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --repo "${{ github.repository }}"
